<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Vitalii Dmytrychenko: builds AI agents and ships in 24 hours. Kyiv, Madrid, Manchester.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf6c9"/>
      <stop offset="0.5" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#7aa7ff" stop-opacity=".55"/><stop offset="1" stop-color="#7aa7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#ff7ad9" stop-opacity=".4"/><stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#7cf6c9" stop-opacity=".35"/><stop offset="1" stop-color="#7cf6c9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .orb { animation: drift 14s ease-in-out infinite alternate; }
    .orb.b { animation-duration: 18s; animation-delay: -6s; }
    .orb.c { animation-duration: 11s; animation-delay: -3s; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,-30px); } }

    .rot { opacity: 0; animation: rot 12s infinite; }
    .rot.r1 { opacity: 1; animation-delay: 0s; }
    .rot.r2 { animation-delay: 3s; }
    .rot.r3 { animation-delay: 6s; }
    .rot.r4 { animation-delay: 9s; }
    @keyframes rot {
      0% { opacity: 0; transform: translateY(8px); }
      4%, 22% { opacity: 1; transform: translateY(0); }
      26%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    .route { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .pin { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .pin.p2 { animation-delay: .8s; }
    .pin.p3 { animation-delay: 1.6s; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }

    .in { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .in.d1 { animation-delay: .15s; }
    .in.d2 { animation-delay: .35s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <circle class="orb" cx="170" cy="250" r="220" fill="url(#orbA)"/>
    <circle class="orb b" cx="880" cy="60" r="230" fill="url(#orbB)"/>
    <circle class="orb c" cx="620" cy="300" r="180" fill="url(#orbC)"/>

    <g class="in">
      <text x="60" y="84" class="mono" font-size="16" fill="#8b93b0">~/vitalii $ <tspan fill="#7cf6c9">cat</tspan> hello.txt</text>
    </g>
    <g class="in d1">
      <text x="56" y="160" class="sans" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Vitalii Dmytrychenko</text>
    </g>

    <g class="mono" font-size="22" fill="#e6e9f5">
      <text x="60" y="210"><tspan fill="#ff7ad9">&gt;</tspan> I build</text>
      <text x="190" y="210" class="rot r1" fill="#7cf6c9">AI agents that talk to each other</text>
      <text x="190" y="210" class="rot r2" fill="#7aa7ff">RAG pipelines on top of pgvector</text>
      <text x="190" y="210" class="rot r3" fill="#ff7ad9">hackathon MVPs in under 24 hours</text>
      <text x="190" y="210" class="rot r4" fill="#ffd36e">automation that replaces spreadsheets</text>
    </g>

    <!-- route: Kyiv -> Madrid -> Manchester -->
    <g class="in d2">
      <path class="route" d="M92 268 C 220 238, 330 300, 452 268 S 690 238, 812 268" fill="none" stroke="#7aa7ff" stroke-opacity=".7" stroke-width="2"/>
      <circle cx="92" cy="268" r="5" fill="#ffd36e"/><circle class="pin" cx="92" cy="268" r="5" fill="none" stroke="#ffd36e" stroke-width="1.5"/>
      <circle cx="452" cy="268" r="5" fill="#ff7ad9"/><circle class="pin p2" cx="452" cy="268" r="5" fill="none" stroke="#ff7ad9" stroke-width="1.5"/>
      <circle cx="812" cy="268" r="5" fill="#7cf6c9"/><circle class="pin p3" cx="812" cy="268" r="5" fill="none" stroke="#7cf6c9" stroke-width="1.5"/>
      <g class="mono" font-size="13" fill="#b7bdd6">
        <text x="106" y="296">Kyiv · where it started</text>
        <text x="466" y="296">Madrid · IB years</text>
        <text x="826" y="296">Manchester · now</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="319" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
