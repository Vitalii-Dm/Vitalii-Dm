<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="neofetch-style summary: CS with Maths at the University of Manchester; previously founding engineer at Hugo and full-stack developer at TrouDigital; 5x hackathon winner; speaks Ukrainian, Russian, English and Spanish; into basketball, drums and chess.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .k { fill: #7aa7ff; font-weight: 700; }
    .v { fill: #e6e9f5; }
    .dim { fill: #8b93b0; }
    .ln { animation: type .35s steps(6) both; }
    @keyframes type { from { opacity: 0; transform: translateX(-6px); } }
    .l0 { animation-delay: .2s; } .l1 { animation-delay: .9s; } .l2 { animation-delay: 1.05s; }
    .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.35s; } .l5 { animation-delay: 1.5s; }
    .l6 { animation-delay: 1.65s; } .l7 { animation-delay: 1.8s; } .l8 { animation-delay: 1.95s; }
    .l9 { animation-delay: 2.1s; } .l10 { animation-delay: 2.25s; } .l11 { animation-delay: 2.4s; }
    .logo { animation: glow 4s ease-in-out infinite alternate; }
    @keyframes glow { from { fill: #7cf6c9; } 50% { fill: #7aa7ff; } to { fill: #ff7ad9; } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1000" height="360" rx="16" fill="#0b0f1a"/>
  <rect x=".5" y=".5" width="999" height="359" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
