    <text x="330" y="120" class="ln l1 dim">──────────────────</text>
    <text x="330" y="146" class="ln l2"><tspan class="k">Study</tspan><tspan x="422" class="v">CS + Maths @ University of Manchester</tspan><tspan class="dim"> (1st class, yr 1)</tspan></text>
