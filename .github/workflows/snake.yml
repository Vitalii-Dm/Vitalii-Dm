name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ff7ad9&color_dots=#ebedf0,#c6f6e4,#7cf6c9,#7aa7ff,#5b4bdb
            dist/snake-dark.svg?palette=github-dark&color_snake=#7cf6c9&color_dots=#161b22,#1d3b52,#2f6f9f,#7aa7ff,#ff7ad9

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
